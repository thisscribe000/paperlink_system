<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Site — Telegram Land</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 12px 16px;
            background: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 { font-size: 16px; font-weight: 600; }
        .slug { color: #666; font-size: 13px; }
        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-save {
            background: #0088cc;
            color: #fff;
        }
        .btn-save:hover { background: #0099e6; }
        .btn-save.saving { opacity: 0.6; pointer-events: none; }
        .btn-preview {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            margin-right: 8px;
        }
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        textarea {
            flex: 1;
            background: #111;
            color: #fff;
            border: none;
            padding: 20px;
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 2;
        }
        .status {
            padding: 8px 16px;
            background: #111;
            border-top: 1px solid #222;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        .status.saved { color: #10b981; }
        .status.error { color: #f43f5e; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #10b981; color: #fff; }
        .toast.error { background: #f43f5e; color: #fff; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>✏️ Code Editor</h1>
            <div class="slug" id="slugDisplay">loading...</div>
        </div>
        <div>
            <button class="btn btn-preview" onclick="preview()">👁 Preview</button>
            <button class="btn btn-save" id="saveBtn" onclick="save()">💾 Save</button>
        </div>
    </header>
    
    <main>
        <textarea id="editor" placeholder="<!-- Your HTML here -->" spellcheck="false"></textarea>
    </main>
    
    <div class="status" id="status">
        <span id="statusText">Loading...</span>
        <span id="charCount">0 chars</span>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        const baseUrl = window.location.origin;
        
        document.getElementById('slugDisplay').textContent = slug || 'no slug';
        
        async function load() {
            if (!slug) {
                showStatus('No slug provided', 'error');
                return;
            }
            
            try {
                const res = await fetch(`${baseUrl}/sites/${slug}/index.html?t=${Date.now()}`);
                const html = await res.text();
                document.getElementById('editor').value = html;
                showStatus('Loaded', 'saved');
                updateCount();
            } catch (e) {
                showStatus('Failed to load', 'error');
            }
        }
        
        async function save() {
            const btn = document.getElementById('saveBtn');
            const html = document.getElementById('editor').value;
            
            btn.classList.add('saving');
            btn.textContent = 'Saving...';
            
            try {
                const initData = window.Telegram?.WebApp?.initData || '';
                
                const res = await fetch(`${baseUrl}/api/site/${slug}/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': initData
                    },
                    body: JSON.stringify({
                        codeMode: true,
                        customHtml: html
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showToast('Saved & Live!', 'success');
                    showStatus('Saved to ' + new Date().toLocaleTimeString(), 'saved');
                } else {
                    throw new Error(data.error || 'Save failed');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
                showStatus('Save failed', 'error');
            } finally {
                btn.classList.remove('saving');
                btn.textContent = '💾 Save';
            }
        }
        
        function preview() {
            window.open(`${baseUrl}/sites/${slug}`, '_blank');
        }
        
        function showStatus(text, type) {
            const el = document.getElementById('status');
            const txt = document.getElementById('statusText');
            txt.textContent = text;
            el.className = 'status ' + type;
        }
        
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.className = 'toast', 3000);
        }
        
        function updateCount() {
            const len = document.getElementById('editor').value.length;
            document.getElementById('charCount').textContent = len + ' chars';
        }
        
        let timeout;
        document.getElementById('editor').addEventListener('input', () => {
            updateCount();
            showStatus('Unsaved changes...', '');
            clearTimeout(timeout);
        });
        
        document.getElementById('editor').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                save();
            }
        });
        
        window.Telegram?.WebApp?.ready();
        window.Telegram?.WebApp?.expand();
        load();
    </script>
</body>
</html>
