name = "paperlink"
compatibility_date = "2024-01-01"
main = "src/cloudflare.ts"
compatibility_flags = ["nodejs_compat"]

[env.production]
vars = { ENVIRONMENT = "production" }

[[r2_buckets]]
binding = "R2"
bucket_name = "paperlink-files"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "d403b5c3688f40de9975326663463d41"

[observability]
enabled = true