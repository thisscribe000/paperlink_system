<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Land Builder</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { text-align: center; max-width: 400px; }
        h1 { font-size: 32px; margin-bottom: 16px; color: #0088cc; }
        p { color: #888; margin-bottom: 24px; line-height: 1.6; }
        .btn { 
            display: inline-block; 
            padding: 14px 28px; 
            background: #0088cc; 
            color: #fff; 
            border-radius: 8px; 
            text-decoration: none;
            font-weight: 600;
            margin: 8px;
        }
        .info { 
            background: #111; 
            border: 1px solid #222; 
            border-radius: 12px; 
            padding: 20px; 
            margin-top: 20px;
            text-align: left;
        }
        .info code { 
            background: #222; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Builder Loading...</h1>
        <p>The visual builder is initializing. If nothing happens, your site may not exist or you don't have permission to edit it.</p>
        
        <div class="info">
            <p><strong>Quick Edit Links:</strong></p>
            <p>Edit directly via bot: <code>/edit [slug]</code></p>
            <p>Or click "Open Visual Builder" in the bot menu.</p>
        </div>
        
        <a href="https://t.me/YourBot" class="btn">Open Bot</a>
        
        <script>
            // Try to extract slug from URL
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            
            if (slug && window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
                
                // Show we're ready
                document.querySelector('h1').textContent = '✅ Builder Ready';
                document.querySelector('p').textContent = 'Site: ' + slug;
            }
        </script>
    </div>
</body>
</html>
